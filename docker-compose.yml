services:
  axaudio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axaudio
    restart: unless-stopped
    ports:
      - "2333:2333"
    environment:
      - PORT=2333
      - RUST_LOG=axAudio=info,tower_http=info
      - TOKIO_WORKER_THREADS=2
      # Opcional: Para usar un proveedor POT externo en lugar del interno en 127.0.0.1:4416:
      # - BGUTIL_POT_URL=http://otro-host:4416
      # - ENABLE_INTERNAL_POT=false
    volumes:
      # Montaje opcional de cookies (archivo individual o carpeta multi-cuenta)
      - ./cookies.txt:/app/cookies.txt:ro
      - ./cookies:/app/cookies:ro
      # Opcional: Persistir la caché de yt-dlp (acelera la resolución y evita re-descargas)
      - ytdlp-cache:/tmp/yt-dlp-cache
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2333/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  # Volumen nombrado para la persistencia opcional de la caché de yt-dlp
  ytdlp-cache:
