name: Build, Version & Publish Docker Image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build, Tag & Publish GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Semantic Version
        id: meta_version
        run: |
          COMMITS=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="1.1.${COMMITS}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "=== Building axAudio version: ${VERSION} (${SHORT_SHA}) ==="

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name for Docker tag
        id: repo_name
        run: |
          echo "lowercase=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.lowercase }}:latest
            ghcr.io/${{ steps.repo_name.outputs.lowercase }}:${{ steps.meta_version.outputs.version }}
            ghcr.io/${{ steps.repo_name.outputs.lowercase }}:${{ steps.meta_version.outputs.tag }}
          build-args: |
            AXAUDIO_VERSION=${{ steps.meta_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta_version.outputs.tag }}
          name: "axAudio v${{ steps.meta_version.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
