[package]
name = "axAudio"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
songbird = { version = "0.6", default-features = false, features = ["driver", "rustls", "builtin-queue", "tungstenite"] }
symphonia = { version = "0.5", features = ["all"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
async-trait = "0.1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
