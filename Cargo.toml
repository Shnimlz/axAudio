[package]
name = "axAudio"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "io-util", "fs"] }
axum = { version = "0.8", features = ["ws"] }
songbird = { version = "0.6", default-features = false, features = ["driver", "rustls", "builtin-queue", "tungstenite"] }
symphonia = { version = "0.5", default-features = false, features = ["mkv", "ogg", "mp3", "aac", "isomp4", "flac", "wav", "vorbis", "pcm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
async-trait = "0.1"
mimalloc = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
